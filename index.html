<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>유성고 이미지 보관소</title>
<style>
:root{color-scheme:dark;--bg:#111317;--panel:#191c22;--line:#2b3038;--text:#f2f4f7;--muted:#9ca3af;--accent:#7c8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(17,19,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px}.wrap{max-width:1200px;margin:auto}h1{margin:0 0 12px;font-size:22px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}input,select,button{background:#20242b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}input{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:var(--accent)}main{padding:18px}.count{margin:14px 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b0d10;display:block}.meta{padding:12px}.name{font-size:14px;font-weight:700;word-break:break-all;margin-bottom:8px}.tags{font-size:12px;color:var(--muted);margin-bottom:10px}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:7px 9px;flex:1}.empty{padding:60px 10px;text-align:center;color:var(--muted)}
</style></head><body><header><div class="wrap"><h1>유성고 이미지 보관소</h1><div class="toolbar">
<input id="q" placeholder="검색 (예: 서유련, 계단, 고민)">
<select id="location"><option value="">모든 장소</option></select><select id="subplace"><option value="">모든 세부장소</option></select><select id="time"><option value="">모든 시간</option></select><select id="character"><option value="">모든 캐릭터</option></select><select id="state"><option value="">모든 상태</option></select>
</div></div></header><main class="wrap"><div class="count" id="count"></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>표시할 이미지가 없음.</div></main>
<script src="./manifest.js"></script><script>
const LABEL={school:"학교",abandoned_school:"폐교",home:"집",classroom:"교실",hallway:"복도",stairs:"계단",restroom:"화장실",day:"낮",night:"밤",seoyuryeon:"서유련",thinking:"고민",dialogue:"대화"};
const label=v=>LABEL[v]||v;
const items=(window.IMAGE_FILES||[]).map(file=>{const path=file.replace(/\\/g,"/");const parts=path.split("/");const filename=parts.pop();const base=filename.replace(/\.[^.]+$/,""),t=base.split("_");let time="",location="",subplace="",character="",state="";
if(t[0]==="day"||t[0]==="night"){time=t[0]; if(t[1]==="abandoned"&&t[2]==="school"){location="abandoned_school";subplace=t[3]||parts[1]||"";character=t[4]||"";state=t.slice(5).join("_");}else{location=t[1]||parts[0]||"";subplace=t[2]||parts[1]||"";character=t[3]||"";state=t.slice(4).join("_");}}else if(t[0]==="home"){location="home";character=t[1]||"";state=t.slice(2).join("_");}return{file:path,filename,time,location,subplace,character,state};});
const $=s=>document.querySelector(s),q=$("#q"),locationSel=$("#location"),subplace=$("#subplace"),time=$("#time"),character=$("#character"),state=$("#state"),grid=$("#grid"),count=$("#count"),empty=$("#empty");
function fill(sel,vals){[...new Set(vals.filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=label(v);sel.appendChild(o);});}fill(locationSel,items.map(x=>x.location));fill(subplace,items.map(x=>x.subplace));fill(time,items.map(x=>x.time));fill(character,items.map(x=>x.character));fill(state,items.map(x=>x.state));
function copy(text,btn){navigator.clipboard.writeText(text).then(()=>{const old=btn.textContent;btn.textContent="복사됨";setTimeout(()=>btn.textContent=old,900);});}
function render(){const term=q.value.trim().toLowerCase();const list=items.filter(x=>(!term||x.file.toLowerCase().includes(term)||[x.time,x.location,x.subplace,x.character,x.state].some(v=>label(v).includes(term)))&&(!locationSel.value||x.location===locationSel.value)&&(!subplace.value||x.subplace===subplace.value)&&(!time.value||x.time===time.value)&&(!character.value||x.character===character.value)&&(!state.value||x.state===state.value));grid.innerHTML="";count.textContent=`${list.length} / ${items.length}장`;empty.hidden=list.length!==0;list.forEach(x=>{const rel=`images/${x.file}`;const direct=new URL(rel,location.href).href;const card=document.createElement("article");card.className="card";card.innerHTML=`<a href="${rel}" target="_blank" rel="noopener"><img class="thumb" src="${rel}" loading="lazy" alt="${x.file}"></a><div class="meta"><div class="name">${x.filename}</div><div class="tags">${[x.time,x.location,x.subplace,x.character,x.state].filter(Boolean).map(label).join(" · ")}</div><div class="actions"><button class="copy-url">URL 복사</button><button class="copy-name">파일명 복사</button></div></div>`;card.querySelector(".copy-url").onclick=e=>copy(direct,e.currentTarget);card.querySelector(".copy-name").onclick=e=>copy(x.filename,e.currentTarget);grid.appendChild(card);});}
[q,locationSel,subplace,time,character,state].forEach(el=>el.addEventListener("input",render));render();
</script></body></html>
